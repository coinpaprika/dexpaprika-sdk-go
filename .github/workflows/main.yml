name: Check & test & build
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality & security checks
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Check out code
        uses: actions/checkout@v7

      - name: Lint Go Code
        run: make check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Check out code
        uses: actions/checkout@v7

      # This job is named Test and ran `make run-example` until 2026-08-07,
      # which builds and runs a sample program. The Makefile has always had a
      # `test` target with the real suite behind it. The effect was a green
      # tick on every push while five tests were failing on main, so the badge
      # said more than the pipeline knew.
      - name: Run tests
        run: make test


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Check out code
        uses: actions/checkout@v7

      - name: Build
        run: make build